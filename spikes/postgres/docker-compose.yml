# Throwaway spike stack for S-06 (PostGIS nearest-provider) and S-10 (offer-acceptance races).
# Not production infrastructure: no persistence, no secrets management, trivial password.
services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_PASSWORD: spike
      POSTGRES_DB: spike
      # Sized to resemble the planned launch compute (Supabase Large: 2 vCPU / 8 GB).
      # Adjust with the real instance size before trusting absolute numbers.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command: >
      postgres
      -c shared_buffers=2GB
      -c effective_cache_size=6GB
      -c work_mem=32MB
      -c maintenance_work_mem=512MB
      -c random_page_cost=1.1
      -c max_connections=200
      -c track_io_timing=on
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spike"]
      interval: 3s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
