openapi: 3.1.0

# Authored, not generated: a Deno handler's routing is code, and inferring an HTTP contract from
# it would be guesswork dressed as a fact. What IS mechanical lives in rpc-catalog/index.json.
#
# The headline for a client developer: of the eight Edge Functions deployed, exactly ONE is
# called by an app (`device-integrity`) and ONE by the admin console (`kyc-document-url`). Two
# are called by Supabase Auth and by payment gateways with their own signatures, three are
# workers invoked on a schedule with a named secret, and `health` answers monitoring. An app that
# finds itself wanting to call a worker has found a bug in its own design, not a missing endpoint.

info:
  title: Suskii Errands — Edge Functions
  version: 1.0.0
  description: >
    Every endpoint returns errors as `{ "error": { "code": "ERR_...", "request_id": "..." } }`
    with the code drawn from contracts/v1/error-codes/codes.json, and echoes `x-request-id`.
    Money never appears in a request body here: the server computes it. See money.schema.json.

servers:
  - url: https://{project_ref}.supabase.co/functions/v1
    variables:
      project_ref:
        default: localhost
        description: Per environment; the app reads it from its bootstrap configuration.

tags:
  - name: app
    description: Callable by a signed-in app.
  - name: admin
    description: Callable by the admin console, as a staff member signed in with a second factor (aal2).
  - name: platform
    description: Called by Supabase Auth or a payment gateway, authenticated by a signature over the raw body.
  - name: worker
    description: Invoked on a schedule with a named secret API key. Never callable by an app.

components:
  securitySchemes:
    supabaseJwt:
      type: http
      scheme: bearer
      description: The signed-in user's Supabase access token.
    webhookSignature:
      type: apiKey
      in: header
      name: webhook-signature
      description: >
        Standard Webhooks signature over the raw request body. The body is stored before it is
        parsed and de-duplicated before it is acted on, so a replay is cheap and a forgery is
        rejected before it can reach the ledger.
    workerKey:
      type: apiKey
      in: header
      name: apikey
      description: A named secret, so one caller's key can be rotated without touching another's.
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code]
          properties:
            code:
              type: string
              pattern: '^ERR_[A-Z0-9_]+$'
            request_id:
              type: string
  responses:
    Error:
      description: A stable error code. Never a raw exception or a vendor message.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

paths:
  /device-integrity:
    post:
      tags: [app]
      operationId: verifyDeviceIntegrity
      security:
        - supabaseJwt: []
      summary: Attest that the app is running on a genuine, unmodified device.
      description: >
        Play Integrity on Android, App Attest on iOS, both verified server-side against the
        vendor's own keys. The verdict is recorded against the device; the app is told only
        whether it passed. A failed verdict is a risk signal, not a refusal: the risk engine
        raises a flag and a person decides (OD-25).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, token]
              properties:
                platform:
                  type: string
                  enum: [android, ios]
                token:
                  type: string
                  description: Play Integrity token, or the App Attest attestation/assertion.
                key_id:
                  type: string
                  description: iOS only. The App Attest key identifier.
                challenge:
                  type: string
      responses:
        '200':
          description: Verdict recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  passed: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /kyc-document-url:
    post:
      tags: [admin]
      operationId: kycDocumentUrl
      security:
        - supabaseJwt: []
      summary: A sixty-second link to one KYC document, for a verification officer.
      description: >
        `kyc-docs` is write-only for every client role, so an officer cannot sign a URL with their
        own token. The function first calls `request_document_access` **as the officer** — the
        database checks aal2, a TOTP code entered in the last five minutes, the role and that the
        folder is not the officer's own, and writes `audit.kyc_access` — and only then signs that
        one path with the service role. The answer is `no-store`: the URL is a capability, and a
        cached copy would outlive its minute. A stale code is `401 ERR_REAUTH_REQUIRED`: verify a
        fresh one on the same session and call again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [upload_ref, reason_code]
              properties:
                upload_ref:
                  type: string
                  description: '`<subject user id>/<file name>` inside `kyc-docs`, as the review queue lists it.'
                  pattern: '^[0-9a-f-]{36}/[A-Za-z0-9._-]{1,200}$'
                reason_code:
                  type: string
                  pattern: '^[a-z0-9_]{3,60}$'
      responses:
        '200':
          description: The signed URL and when it stops working.
          content:
            application/json:
              schema:
                type: object
                required: [url, expires_at]
                properties:
                  url: { type: string, format: uri }
                  expires_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /concierge:
    post:
      tags: [customer]
      operationId: conciergeTurn
      security:
        - supabaseJwt: []
      summary: One turn of Ask Suskii, the text concierge (ADR-0024).
      description: >
        Open the conversation first with the RPC `concierge_start` (idempotent; `ERR_FEATURE_UNAVAILABLE`
        when `concierge.text` is off for the caller's country). Each message is then one call here, with
        a fresh idempotency key per message that is held across retries: a retried key returns the
        recorded reply and never a second model call. Read the history from `ai_messages` (own rows,
        redacted as stored); a `concierge.turn` broadcast on `user:{id}` says it changed.

        The concierge never publishes, accepts, pays or sets money. A finished errand comes back as
        `proposed_action: handoff_to_form` with the draft: open the request form with it, where the
        customer sets the map pin and the price and publishes. A switched-off concierge, a limit, or a
        model that is down is also a `200` with `handoff_to_form`, never an error, so the app is never
        blocked on the AI. `show_sos_card` means show the SOS card and the emergency numbers first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conversation_id, text, idempotency_key]
              properties:
                conversation_id: { type: string, format: uuid }
                text: { type: string, minLength: 1, maxLength: 1000 }
                idempotency_key: { type: string, minLength: 16, maxLength: 128 }
      responses:
        '200':
          description: The reply, as recorded.
          content:
            application/json:
              schema:
                type: object
                required: [reply, proposed_action, message]
                properties:
                  reply: { type: string, description: 'Redacted and filtered: no links off the app, no numbers.' }
                  proposed_action:
                    type: string
                    enum: [none, handoff_to_form, show_sos_card]
                  draft:
                    type: object
                    nullable: true
                    description: >
                      Slots so far, snake_case: category_key, category_id, is_custom_category,
                      custom_category_label, description, pickup_label, pickup_landmark_note,
                      destination_label, destination_landmark_note, urgency, scheduled_at,
                      missing_slots. Never a price, a float or a declared value.
                  message:
                    type: object
                    description: The assistant row as stored in `ai_messages` (id, body, structured_draft, proposed_action, language, created_at).
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /auth-send-sms:
    post:
      tags: [platform]
      operationId: authSendSms
      security:
        - webhookSignature: []
      summary: Supabase Auth's send-SMS hook. Not callable by an app.
      description: >
        `verify_jwt = false` in config.toml, because Auth calls it without one; the Standard
        Webhooks signature inside the handler is the authentication. **The vendor adapters are
        deliberately unwritten** — Nigerian sender-ID registration and DND whitelisting take
        weeks and have not started (client action 5), so there is no account to send through.
      responses:
        '200': { description: Accepted for delivery. }
        '401': { $ref: '#/components/responses/Error' }

  /payments-webhook:
    post:
      tags: [platform]
      operationId: paymentsWebhook
      security:
        - webhookSignature: []
      summary: A payment gateway reporting a charge, a transfer or a refund.
      description: >
        The order is the contract: verify the signature over the **raw** body, store the raw
        event, de-duplicate across partitions, verify server-side with the gateway, and only then
        post to the ledger. A client cannot reach this path and cannot confirm its own payment —
        `confirm_payment` has no grant to any client role, and a pgTAP test asserts it.
      responses:
        '200': { description: Stored. Idempotent on the gateway's event id. }
        '401': { $ref: '#/components/responses/Error' }

  /payments-worker:
    post:
      tags: [worker]
      operationId: paymentsWorker
      security:
        - workerKey: []
      summary: Drain the payment outbox — checkout, transfer, name enquiry, refund.
      description: >
        Claims work with FOR UPDATE SKIP LOCKED and calls the country pack's gateway. The
        Flutterwave and Paystack adapters are deliberately unwritten: their payload shapes and
        signature schemes are not in the research and spike S-12 settles them against a sandbox
        that needs merchant accounts (client action 4). The console provider refuses to run in
        production, so a country pack still routing to it fails loudly rather than silently
        pretending to move money.
      responses:
        '200': { description: Batch processed. }
        '401': { $ref: '#/components/responses/Error' }

  /notifications-worker:
    post:
      tags: [worker]
      operationId: notificationsWorker
      security:
        - workerKey: []
      summary: Drain the notification outbox and send per channel.
      description: >
        Re-decides nothing: `private.notify` already applied channel preferences and quiet hours
        and wrote the decision onto the event. Records an outcome per channel and retries only
        when every channel failed. The push payload is built from the message rather than copied
        from it, so an amount or a name can never reach a lock screen. **No push actually leaves
        the building**: APNs and FCM credentials do not exist (client action 6).
      responses:
        '200': { description: Batch processed. }
        '401': { $ref: '#/components/responses/Error' }

  /storage-worker:
    post:
      tags: [worker]
      operationId: storageWorker
      security:
        - workerKey: []
      summary: Remove the storage folders account erasure queued.
      description: >
        Drains the `storage` outbox aggregate. Storage refuses direct deletes from
        storage.objects, so `private.erase_account` queues the user's `avatars` folder and this
        worker removes it through the Storage API (audit 2026-09-27 Y.30). It acts only on an
        allowlisted bucket and only on a prefix that is exactly the event's own user folder; an
        unknown event fails without retry rather than being completed unread.
      responses:
        '200': { description: Batch processed. }
        '401': { $ref: '#/components/responses/Error' }

  /health:
    get:
      tags: [platform]
      operationId: health
      security:
        - workerKey: []
      summary: Uptime and dependency check for Cloud Monitoring.
      description: |
        Two uptime checks call this. The default scope is the platform's health: 503 when any check
        fails, 200 with warnings in the body. `scope=safety` is RB-06's alarm: 503 while an escalated
        SOS is unacknowledged, or while that cannot be known. It carries counts and an age only.
        The deploy smoke test reads the default scope, so an SOS never blocks a deploy.
      parameters:
        - name: scope
          in: query
          required: false
          schema: { type: string, enum: [safety] }
      responses:
        '200':
          description: Healthy, or nobody waiting on an SOS.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      status: { type: string, enum: [ok, warn] }
                      checks: { type: object, additionalProperties: true }
                  - type: object
                    properties:
                      status: { type: string, enum: [ok] }
                      unacknowledged: { type: integer }
        '400':
          description: An unknown scope (`ERR_INVALID_ARGUMENT`). Never read as the default.
        '503':
          description: A check failed, the database is unreachable, or an escalated SOS is unacknowledged.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [fail] }
                  checks: { type: object, additionalProperties: true }
                  unacknowledged: { type: integer }
                  oldest_escalated_seconds: { type: integer, nullable: true }
