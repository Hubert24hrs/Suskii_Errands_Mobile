name: suskii_mobile
description: Suskii Errands mobile app — Customer + Provider modes.
publish_to: none
version: 1.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ^3.47.1

dependencies:
  clock: ^1.1.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  suskii_core:
    path: ../../packages/suskii_core
  suskii_data:
    path: ../../packages/suskii_data
  suskii_design:
    path: ../../packages/suskii_design
  suskii_domain:
    path: ../../packages/suskii_domain
  suskii_l10n:
    path: ../../packages/suskii_l10n
  supabase_flutter: ^2.17.2
  flutter_secure_storage: ^11.2.0
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1
  shared_preferences: ^2.5.5
  sentry_flutter: ^9.30.1
  geolocator: ^14.1.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.7
  google_maps_flutter: 2.18.2
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1

# The maps plugin's iOS and web halves had releases under two weeks old when this was added; pinned
# to the previous ones (the project's rule for third-party code). Lift once they have aged.
dependency_overrides:
  google_maps_flutter_ios: 2.18.6
  google_maps_flutter_web: 0.6.4+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  image_picker_platform_interface: ^2.11.1

flutter:
  uses-material-design: true
