name: suskii_mobile
description: Suskii Errands mobile app — Customer + Provider modes.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ^3.47.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  suskii_core:
    path: ../../packages/suskii_core
  suskii_data:
    path: ../../packages/suskii_data
  suskii_design:
    path: ../../packages/suskii_design
  suskii_domain:
    path: ../../packages/suskii_domain
  suskii_l10n:
    path: ../../packages/suskii_l10n
  supabase_flutter: ^2.17.2
  flutter_secure_storage: ^11.2.0
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1
  shared_preferences: ^2.5.5
  sentry_flutter: ^9.30.1
  geolocator: ^14.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  image_picker_platform_interface: ^2.11.1

flutter:
  uses-material-design: true
