version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ^3.47.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  suskii_core:
    path: ../../packages/suskii_core
  suskii_data:
    path: ../../packages/suskii_data
  suskii_design:
    path: ../../packages/suskii_design
  suskii_domain:
    path: ../../packages/suskii_domain
  suskii_l10n:
    path: ../../packages/suskii_l10n

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
