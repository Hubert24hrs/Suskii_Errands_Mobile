name: mobile-release

# Signed store builds and uploads (docs/runbooks/RB-15-store-release.md). Started by hand, or
# by pushing a tag mobile-v<semver>. Every credential is a secret of the GitHub environment the
# run targets (dev, staging, prod); none is in the repository, and a run whose secrets are
# missing fails at the step that needs them instead of producing an unsigned or mock build.
#
# Secrets, per environment (RB-15 says where each comes from):
#   SUPABASE_URL, SUPABASE_ANON_KEY, SENTRY_DSN          public client values, merged into the
#                                                        define file at build time
#   ANDROID_UPLOAD_KEYSTORE_BASE64, ANDROID_UPLOAD_KEYSTORE_PASSWORD,
#   ANDROID_UPLOAD_KEY_ALIAS, ANDROID_UPLOAD_KEY_PASSWORD     Play upload key
#   PLAY_SERVICE_ACCOUNT_JSON                            Play Developer API service account
#   APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8     App Store Connect API key
# Variable (repository or environment): BUILD_NUMBER_FLOOR, the highest build number a store
# already holds, when the app got there some other way (RB-15 §3.4).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which backend and app identity to build for
        type: choice
        options: [prod, staging, dev]
        default: staging
      platforms:
        type: choice
        options: [both, android, ios]
        default: both
      play_track:
        description: Play track for the upload
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      upload:
        description: Upload to Play and TestFlight (off builds and keeps the artifacts only)
        type: boolean
        default: true
      build_number:
        description: Force this build number (versionCode / CFBundleVersion); empty for BUILD_NUMBER_FLOOR + run x 10
        type: string
        default: ''
  push:
    tags: ['mobile-v*']

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ inputs.environment || 'prod' }}
  cancel-in-progress: false

env:
  APP_ENV: ${{ inputs.environment || 'prod' }}
  UPLOAD: ${{ github.event_name == 'push' || inputs.upload }}
  PLAY_TRACK: ${{ inputs.play_track || 'internal' }}

jobs:
  android:
    if: ${{ !inputs.platforms || inputs.platforms != 'ios' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment || 'prod' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Store build numbers only go up. Run number x 10 leaves room for a hotfix uploaded by hand
      # between two runs; the repository variable BUILD_NUMBER_FLOOR lifts the series above what a
      # store already holds (the app reached Play before this workflow uploaded anything, RB-15
      # §3.4). Play's ceiling is 2100000000 [V] developer.android.com/studio/publish/versioning.
      - name: Build number
        env:
          REQUESTED: ${{ inputs.build_number }}
          FLOOR: ${{ vars.BUILD_NUMBER_FLOOR }}
        run: |
          set -euo pipefail
          floor="${FLOOR:-0}"
          [[ "$floor" =~ ^[0-9]+$ ]] || { echo "BUILD_NUMBER_FLOOR must be a whole number, got '$floor'"; exit 1; }
          n="${REQUESTED:-$(( floor + GITHUB_RUN_NUMBER * 10 ))}"
          [[ "$n" =~ ^[1-9][0-9]*$ ]] || { echo "build number must be a positive whole number, got '$n'"; exit 1; }
          if [ "$n" -le "$floor" ]; then echo "build number $n is not above BUILD_NUMBER_FLOOR $floor"; exit 1; fi
          if [ "$n" -gt 2100000000 ]; then echo "build number $n is above Play's ceiling"; exit 1; fi
          echo "BUILD_NUMBER=$n" >> "$GITHUB_ENV"
          echo "Build number $n"
      - name: Tag matches pubspec version
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: \([^+]*\).*/\1/p' apps/mobile/pubspec.yaml)"
          test "mobile-v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != pubspec $version"; exit 1; }
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: apps/mobile
      - name: Resolve packages and generate code
        run: apps/mobile/tool/bootstrap.sh
      - name: Define file with this environment's backend
        working-directory: apps/mobile
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          FIREBASE_ANDROID_API_KEY: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
          FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: tool/write_release_env.sh "$APP_ENV"
      - name: Upload key
        working-directory: apps/mobile
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            test -n "${!v}" || { echo "Missing secret for $v (RB-15, client action)"; exit 1; }
          done
          # Outside the checkout, so nothing can stage it.
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - name: Signed App Bundle
        working-directory: apps/mobile
        run: bundle exec fastlane android build env:"$APP_ENV"
      - name: Upload to Play (${{ env.PLAY_TRACK }})
        if: env.UPLOAD == 'true'
        working-directory: apps/mobile
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: bundle exec fastlane android upload env:"$APP_ENV" track:"$PLAY_TRACK"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-${{ env.APP_ENV }}-${{ env.BUILD_NUMBER }}
          path: |
            apps/mobile/build/app/outputs/bundle/release/app-release.aab
            apps/mobile/build/app/outputs/mapping/release/mapping.txt
            apps/mobile/build/symbols/android/
          retention-days: 90
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" apps/mobile/android/key.properties

  ios:
    if: ${{ !inputs.platforms || inputs.platforms != 'android' }}
    runs-on: macos-15
    timeout-minutes: 90
    environment: ${{ inputs.environment || 'prod' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Store build numbers only go up. Run number x 10 leaves room for a hotfix uploaded by hand
      # between two runs; the repository variable BUILD_NUMBER_FLOOR lifts the series above what a
      # store already holds (the app reached Play before this workflow uploaded anything, RB-15
      # §3.4). Play's ceiling is 2100000000 [V] developer.android.com/studio/publish/versioning.
      - name: Build number
        env:
          REQUESTED: ${{ inputs.build_number }}
          FLOOR: ${{ vars.BUILD_NUMBER_FLOOR }}
        run: |
          set -euo pipefail
          floor="${FLOOR:-0}"
          [[ "$floor" =~ ^[0-9]+$ ]] || { echo "BUILD_NUMBER_FLOOR must be a whole number, got '$floor'"; exit 1; }
          n="${REQUESTED:-$(( floor + GITHUB_RUN_NUMBER * 10 ))}"
          [[ "$n" =~ ^[1-9][0-9]*$ ]] || { echo "build number must be a positive whole number, got '$n'"; exit 1; }
          if [ "$n" -le "$floor" ]; then echo "build number $n is not above BUILD_NUMBER_FLOOR $floor"; exit 1; fi
          if [ "$n" -gt 2100000000 ]; then echo "build number $n is above Play's ceiling"; exit 1; fi
          echo "BUILD_NUMBER=$n" >> "$GITHUB_ENV"
          echo "Build number $n"
      # Uploads must be built with Xcode 26 or later since 28 Apr 2026 [V]
      # developer.apple.com/news/upcoming-requirements. VERIFY-IN-RESEARCH: the runner image.
      - name: Select Xcode 26
        run: |
          set -euo pipefail
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort | tail -1)"
          test -n "$xcode" || { echo "No Xcode 26 on this runner image"; find /Applications -maxdepth 1 -name 'Xcode*.app'; exit 1; }
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: apps/mobile
      - name: Resolve packages and generate code
        run: apps/mobile/tool/bootstrap.sh
      - name: Define file with this environment's backend
        working-directory: apps/mobile
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
        run: tool/write_release_env.sh "$APP_ENV"
      - name: Signed archive${{ env.UPLOAD == 'true' && ' and TestFlight upload' || '' }}
        working-directory: apps/mobile
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ "$UPLOAD" = true ]; then
            bundle exec fastlane ios release env:"$APP_ENV"
          else
            bundle exec fastlane ios archive env:"$APP_ENV"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-${{ env.APP_ENV }}-${{ env.BUILD_NUMBER }}
          path: |
            apps/mobile/build/ios/ipa/*.ipa
            apps/mobile/build/ios/ipa/*.dSYM.zip
            apps/mobile/build/symbols/ios/
          retention-days: 90
