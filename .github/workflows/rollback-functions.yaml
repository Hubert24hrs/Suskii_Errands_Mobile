name: rollback-functions

# Redeploys Edge Functions (and their secrets) from an earlier commit on main. Database
# migrations are never rolled back: fix forward, or restore from PITR per RB-09 (RB-14).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to roll back
        required: true
        type: choice
        options: [dev, staging, production]
      sha:
        description: Full commit SHA of the last known-good release
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit is on main
        env:
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full 40-character commit SHA"; exit 1; }
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::$SHA is not on main"; exit 1; }

  rollback:
    needs: verify
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy-supabase.yaml
    with:
      environment: ${{ inputs.environment }}
      sha: ${{ inputs.sha }}
      mode: functions
    secrets: inherit
