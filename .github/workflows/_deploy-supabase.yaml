name: _deploy-supabase

# Reusable: deploys one commit to one Supabase environment (docs/plan/infra-cicd.md §6,
# RB-14). Order per §6.2: migrations (expand-only) → function secrets → functions → auth config
# → smoke test. Called by pipeline-main.yaml (dev, staging), deploy-production.yaml and
# rollback-functions.yaml (functions only).
#
# Each GitHub environment (dev, staging, production) holds:
#   vars:    SUPABASE_PROJECT_REF, SITE_URL, ADDITIONAL_REDIRECT_URLS, SUSKII_ENV,
#            GCP_PROJECT_ID, GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_DEPLOYER_SA, ANDROID_PACKAGE_NAME
#   secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, HEALTH_CHECK_API_KEY,
#            SUPABASE_AUTH_CAPTCHA_SECRET (optional)
# Runtime secrets for functions come from GCP Secret Manager through Workload Identity (§4).

on:
  workflow_call:
    inputs:
      environment:
        description: dev, staging or production
        type: string
        required: true
      sha:
        description: Full commit SHA to deploy
        type: string
        required: true
      mode:
        description: full, or functions (rollback of Edge Functions only)
        type: string
        default: full

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-supabase-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SITE_URL: ${{ vars.SITE_URL }}
      ADDITIONAL_REDIRECT_URLS: ${{ vars.ADDITIONAL_REDIRECT_URLS }}
      SUPABASE_AUTH_CAPTCHA_SECRET: ${{ secrets.SUPABASE_AUTH_CAPTCHA_SECRET }}
    steps:
      - name: Check inputs and environment configuration
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SHA: ${{ inputs.sha }}
          MODE: ${{ inputs.mode }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_DEPLOYER_SA: ${{ vars.GCP_DEPLOYER_SA }}
          SUSKII_ENV: ${{ vars.SUSKII_ENV }}
          HEALTH_CHECK_API_KEY: ${{ secrets.HEALTH_CHECK_API_KEY }}
        run: |
          set -euo pipefail
          [[ "$ENVIRONMENT" =~ ^(dev|staging|production)$ ]] || { echo "::error::bad environment $ENVIRONMENT"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full 40-character commit SHA"; exit 1; }
          [[ "$MODE" =~ ^(full|functions)$ ]] || { echo "::error::bad mode $MODE"; exit 1; }
          missing=()
          for name in SUPABASE_PROJECT_REF SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SITE_URL SUSKII_ENV \
                      GCP_PROJECT_ID GCP_WORKLOAD_IDENTITY_PROVIDER GCP_DEPLOYER_SA HEALTH_CHECK_API_KEY; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::environment '$ENVIRONMENT' is missing: ${missing[*]} (see RB-14)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - id: runtime
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        with:
          secrets: |-
            send_sms_hook_secrets:${{ vars.GCP_PROJECT_ID }}/send-sms-hook-secrets
            play_integrity_sa:${{ vars.GCP_PROJECT_ID }}/google-play-integrity-service-account
            sentry_dsn:${{ vars.GCP_PROJECT_ID }}/sentry-dsn-edge-functions

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Migrations — dry run
        if: inputs.mode == 'full'
        run: supabase db push --linked --dry-run --password "$SUPABASE_DB_PASSWORD"

      # No --include-all: a migration older than the remote history means someone rewrote an
      # applied migration, which must stop the deploy (ADR-0013 editability ends at first apply).
      - name: Migrations — apply
        if: inputs.mode == 'full'
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Function secrets
        env:
          SEND_SMS_HOOK_SECRETS: ${{ steps.runtime.outputs.send_sms_hook_secrets }}
          PLAY_INTEGRITY_SA: ${{ steps.runtime.outputs.play_integrity_sa }}
          SENTRY_DSN: ${{ steps.runtime.outputs.sentry_dsn }}
          SUSKII_ENV: ${{ vars.SUSKII_ENV }}
          ANDROID_PACKAGE_NAME: ${{ vars.ANDROID_PACKAGE_NAME }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          umask 077
          env_file="$RUNNER_TEMP/functions.env"
          # Service account JSON is compacted to one line; values are single-quoted for the
          # dotenv parser and contain no single quotes.
          play_sa=""
          if [ -n "$PLAY_INTEGRITY_SA" ]; then play_sa="$(printf '%s' "$PLAY_INTEGRITY_SA" | jq -c .)"; fi
          {
            printf "SEND_SMS_HOOK_SECRETS='%s'\n" "$SEND_SMS_HOOK_SECRETS"
            printf "SUSKII_ENV='%s'\n" "$SUSKII_ENV"
            printf "SUSKII_RELEASE='%s'\n" "$SHA"
            printf "SENTRY_DSN='%s'\n" "$SENTRY_DSN"
            printf "ANDROID_PACKAGE_NAME='%s'\n" "$ANDROID_PACKAGE_NAME"
            printf "GOOGLE_PLAY_INTEGRITY_SERVICE_ACCOUNT='%s'\n" "$play_sa"
          } > "$env_file"
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" --env-file "$env_file"
          rm -f "$env_file"

      - name: Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api

      - name: Auth and project config
        if: inputs.mode == 'full'
        env:
          SEND_SMS_HOOK_SECRETS: ${{ steps.runtime.outputs.send_sms_hook_secrets }}
        run: |
          set -euo pipefail
          bash supabase/deploy/write-remote-config.sh supabase/config.toml
          supabase config push --project-ref "$SUPABASE_PROJECT_REF" --yes

      - name: Smoke test — health
        env:
          HEALTH_CHECK_API_KEY: ${{ secrets.HEALTH_CHECK_API_KEY }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          url="https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/health"
          for attempt in 1 2 3 4 5 6; do
            code="$(curl -sS -o "$RUNNER_TEMP/health.json" -w '%{http_code}' -H "apikey: $HEALTH_CHECK_API_KEY" "$url" || true)"
            release="$(jq -r '.release // empty' "$RUNNER_TEMP/health.json" 2>/dev/null || true)"
            if [ "$code" = "200" ] && [ "$release" = "$SHA" ]; then
              echo "healthy on $SHA"
              exit 0
            fi
            echo "attempt $attempt: HTTP $code, release '$release'"
            sleep 10
          done
          jq . "$RUNNER_TEMP/health.json" 2>/dev/null || true
          echo "::error::health check did not pass on the new release (RB-14: roll back functions)"
          exit 1

      - name: Summary
        if: always()
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SHA: ${{ inputs.sha }}
          MODE: ${{ inputs.mode }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### Supabase deploy: $ENVIRONMENT"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`$SHA\` |"
            echo "| Mode | $MODE |"
            echo "| Result | $JOB_STATUS |"
          } >> "$GITHUB_STEP_SUMMARY"
