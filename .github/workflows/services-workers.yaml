name: services-workers

# Backend workers CI (docs/plan/infra-cicd.md §5). The integration job runs with PostgreSQL 17
# client tools against a PostGIS server that has the real Supabase migrations applied, so dump,
# restore and verification are exercised for real. The image job builds the shipped container.
on:
  push:
    branches: [main]
    paths:
      - 'services/workers/**'
      - 'supabase/migrations/**'
      - 'supabase/seed/**'
      - 'supabase/local-fallback/**'
      - '.github/workflows/services-workers.yaml'
  pull_request:
    paths:
      - 'services/workers/**'
      - 'supabase/migrations/**'
      - 'supabase/seed/**'
      - 'supabase/local-fallback/**'
      - '.github/workflows/services-workers.yaml'

permissions:
  contents: read

concurrency:
  group: services-workers-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/workers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.15
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest -q -m "not integration"

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Client tools only: the restore runs on the `source` server, which has PostGIS.
    container: postgres:17-trixie
    services:
      source:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: source
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.15
      - name: Apply the Supabase migrations and seed to the source database
        env:
          PSQL: psql
          SKIP_TESTS: "1"
        run: bash supabase/local-fallback/run-plain-postgres.sh
      - name: Backup, restore and verification tests
        working-directory: services/workers
        env:
          BACKUP_TEST_SOURCE_URL: postgresql://postgres:postgres@source:5432/suskii_test
          BACKUP_TEST_ADMIN_URL: postgresql://postgres:postgres@source:5432/postgres
        run: |
          uv sync --frozen
          uv run pytest -q -m integration

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      source:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: docker build -t suskii-backup:ci services/workers
      - name: The image runs and refuses to start without configuration
        run: |
          set +e
          docker run --rm suskii-backup:ci dump
          code=$?
          set -e
          [ "$code" -eq 2 ] || { echo "expected exit 2 for missing configuration, got $code"; exit 1; }
      - name: Prepare a source database with the Supabase migrations
        run: |
          set -euo pipefail
          docker run --rm --network host -v "$PWD/supabase:/supabase:ro"             -e PGHOST=127.0.0.1 -e PGPORT=5432 -e PGUSER=postgres -e PGPASSWORD=postgres             -e PSQL=psql -e SKIP_TESTS=1 --entrypoint bash suskii-backup:ci             /supabase/local-fallback/run-plain-postgres.sh
      - name: The shipped image dumps, then verifies with its own throwaway PostgreSQL
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/backups" && chmod 0777 "$RUNNER_TEMP/backups"
          common=(--rm --network host -v "$RUNNER_TEMP/backups:/backups"
                  -e SUSKII_ENV=ci -e BACKUP_STORAGE_URL=file:///backups
                  -e BACKUP_SOURCE_URL=postgresql://postgres:postgres@127.0.0.1:5432/suskii_test)
          docker run "${common[@]}" suskii-backup:ci dump
          docker run "${common[@]}" suskii-backup:ci verify
          ls "$RUNNER_TEMP"/backups/db/ci/*/*/*/ | grep -E '\.verify-.*\.json$'
