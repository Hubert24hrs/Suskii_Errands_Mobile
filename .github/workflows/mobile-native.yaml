name: mobile-native

# The Android store build, compiled on every change that could break it (RB-15). frontend-ci
# runs the Dart suites; this proves the release bundle (R8 and resource shrinking included)
# still compiles. Nothing is uploaded to a store and the bundle is debug-signed: this workflow
# never sees the Play upload key. mobile-ios.yaml is the iOS half; mobile-release.yaml signs.
# The test APK built on main is signed with a fixed test key when the ANDROID_DEV_* secrets
# exist (RB-15 action 32), so each new one installs over the last; pull requests never get it.
on:
  pull_request:
    paths: ['apps/mobile/**', 'packages/**', '.github/workflows/mobile-native.yaml']
  push:
    branches: [main]
    paths: ['apps/mobile/**', 'packages/**', '.github/workflows/mobile-native.yaml']
  schedule:
    # Weekly, so an SDK or plugin release that breaks the native build is noticed before a
    # release depends on it.
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-native-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Resolve packages and generate code
        run: apps/mobile/tool/bootstrap.sh
      - name: Release App Bundle (prod defines)
        working-directory: apps/mobile
        run: flutter build appbundle --release --dart-define-from-file=config/env/prod.json
      # Minimum permissions (audit Y.10): a plugin upgrade that quietly adds a sensitive
      # permission to the merged manifest fails here instead of in Play review. It runs before
      # the dev APK because both builds write the same release manifest path, and the manifest
      # that matters is the one in the bundle Play receives.
      - name: Merged manifest asks for nothing sensitive
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          # merged_manifests/ holds the final, packaged manifest (merged_manifest/, singular, is an
          # earlier stage of the merge).
          manifest="$(find build/app/intermediates/merged_manifests -path '*release*' -name AndroidManifest.xml | sort | head -1)"
          test -n "$manifest" || { echo "merged release manifest not found"; exit 1; }
          echo "== $manifest"
          grep -q 'package="com.suskiierrands.app"' "$manifest" || {
            echo "not the prod manifest (expected package com.suskiierrands.app, no suffix)"; exit 1; }
          grep -o 'uses-permission[^>]*android:name="[^"]*"' "$manifest" | sed 's/.*android:name=//' | sort -u
          # RECORD_AUDIO is declared on purpose for in-app calls (RB-15, 2026-10-26); it left this list then.
          denied='FOREGROUND_SERVICE[A-Z_]*|CAMERA|READ_MEDIA_[A-Z_]*|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|ACCESS_BACKGROUND_LOCATION|READ_CONTACTS|READ_PHONE_STATE|READ_SMS|RECEIVE_SMS|SYSTEM_ALERT_WINDOW|QUERY_ALL_PACKAGES|REQUEST_INSTALL_PACKAGES|MANAGE_EXTERNAL_STORAGE'
          if grep -Eo "uses-permission[^>]*android:name=\"android.permission.($denied)\"" "$manifest"; then
            echo "A sensitive permission reached the merged manifest; declare it on purpose (RB-15) or remove the plugin that added it."
            exit 1
          fi
          # A service with a type is a foreground-service declaration on the Play listing (OD-27).
          if grep -n 'foregroundServiceType' "$manifest"; then
            echo "A foreground service type reached the merged manifest; strip it with tools:remove as geolocator's is."
            exit 1
          fi
      - name: Release APK (dev defines, for installing on a test device)
        working-directory: apps/mobile
        # The Maps key comes from a secret; without it the APK shows the location fallback.
        # The test key is handed over only for a build of main: a pull request signs with the
        # runner's throwaway debug key, as before.
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          DEV_KEYSTORE_BASE64: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.ANDROID_DEV_KEYSTORE_BASE64 || '' }}
          DEV_KEYSTORE_PASSWORD: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.ANDROID_DEV_KEYSTORE_PASSWORD || '' }}
          DEV_KEY_ALIAS: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.ANDROID_DEV_KEY_ALIAS || '' }}
          DEV_KEY_PASSWORD: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.ANDROID_DEV_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          tool/write_release_env.sh dev
          if [ -n "$DEV_KEYSTORE_BASE64" ]; then
            for v in DEV_KEYSTORE_PASSWORD DEV_KEY_ALIAS DEV_KEY_PASSWORD; do
              test -n "${!v}" || { echo "ANDROID_DEV_KEYSTORE_BASE64 is set but the secret for $v is not (RB-15 action 32)"; exit 1; }
            done
            # Outside the checkout, so nothing can stage it; removed by the last step.
            printf '%s' "$DEV_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dev.jks"
            {
              echo "storeFile=$RUNNER_TEMP/dev.jks"
              echo "storePassword=$DEV_KEYSTORE_PASSWORD"
              echo "keyAlias=$DEV_KEY_ALIAS"
              echo "keyPassword=$DEV_KEY_PASSWORD"
            } > android/key.properties
            echo "Signing the test APK with the fixed test key."
          else
            echo "No test key for this build: the APK is signed with the runner's debug key."
          fi
          flutter build apk --release --dart-define-from-file=build/env/dev.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-unsigned-builds
          path: |
            apps/mobile/build/app/outputs/bundle/release/app-release.aab
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/dev.jks" apps/mobile/android/key.properties

  # A fixed download link for testing on a phone, published at the owner's request (2026-09-30):
  # the dev APK from the latest main build, as the `dev-latest` pre-release. The repository is
  # public, so the link needs no GitHub login, and it never changes, so a QR code of it keeps
  # working (RB-15). Demo data only, because dev.json has no backend, and signed with the test key
  # (or the runner's debug key before that exists): for a test device, never for Play. Pull
  # requests never publish, and the build job keeps its read-only token.
  publish-dev-apk:
    needs: android
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-dev-apk
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-unsigned-builds
          path: out
      - name: Replace the dev-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          apk="$(find out -name app-release.apk | head -1)"
          test -n "$apk" || { echo "the dev APK is not in the artifact"; exit 1; }
          cp "$apk" suskii-dev.apk
          # Delete and recreate so the tag moves to this commit. The download URL is by tag name,
          # so it stays the same: /releases/download/dev-latest/suskii-dev.apk
          gh release delete dev-latest --cleanup-tag --yes || true
          gh release create dev-latest suskii-dev.apk --prerelease --target "$GITHUB_SHA" \
            --title "Suskii Errands test APK (latest main build)" \
            --notes "Built from ${GITHUB_SHA::7} by run ${GITHUB_RUN_ID}. Demo data, no backend: sign in with any phone number and any 6-digit code. Signed with a test key, not the Play key: Android asks to allow the install, and this is not the Play build. Replaced on every build of main."
