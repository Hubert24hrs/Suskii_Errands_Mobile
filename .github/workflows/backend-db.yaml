name: backend-db

# Database CI (docs/plan/infra-cicd.md §5). Path-filtered so it never runs for frontend-only
# changes and never overlaps frontend-ci.yaml, which belongs to Kimi Code. The exceptions are
# the data layers that talk to this database, whose end-to-end runs live here because they
# need the stack: the app's Supabase repositories, the admin console (audit Z.8) and the
# website (audit 2026-10-24).
# On main it runs as the first stage of pipeline-main.yaml, which deploys only if it passes.
on:
  pull_request:
    paths: ['supabase/**', '.github/workflows/backend-db.yaml',
            'packages/suskii_data/lib/src/supabase/**', 'packages/suskii_data/test/integration/**',
            'apps/web-admin/**', 'packages/web-config/**', 'tests/web-admin-e2e/**',
            'apps/web-customer/src/lib/supabase/**', 'tests/web-customer-e2e/**']
  workflow_call:

permissions:
  contents: read

concurrency:
  group: backend-db-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  database:
    # Pinned: ubuntu-latest moved to 26.04 (2026-10-24), which Playwright 1.56.1
    # cannot install Chromium's system dependencies for. Unpin with a Playwright upgrade.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # CI-only placeholder so config.toml's send_sms hook validates; not a real secret.
      SEND_SMS_HOOK_SECRETS: v1,whsec_Y2ktb25seS1wbGFjZWhvbGRlci1ub3QtYS1zZWNyZXQ=
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0

      - name: Deploy config writer tests
        run: bash supabase/deploy/write-remote-config_test.sh

      # Auth (gotrue) and storage stay up so the hook wiring in config.toml and the bucket
      # policies are exercised against the real services; the rest is skipped.
      - name: AI tool allowlist (ai-design 4.2)
        run: python services/ai/tools/check_allowlist.py .

      # The control that would have caught U.1, U.3 and V.1. A deny test passes whether the
      # denial is correct or the allow clause was never written; this tells those apart by
      # checking the matrix and the schema describe the same things. Divergences are either
      # fixed or waived with a reason in supabase/tools/rls-matrix-waivers.json.
      - name: RLS matrix coverage
        run: python supabase/tools/check_rls_matrix.py .

      # db push refuses a migration older than one already applied, so two branches that merge
      # out of timestamp order leave main undeployable (three staging deploys, 2026-10-26).
      - name: Migrations added after the base branch's newest
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          python supabase/tools/check_migration_order.py FETCH_HEAD

      # Realtime stays up for the admin console's SOS feed (`ops:sos`); mailpit for the website's
      # email sign-up (tests/web-customer-e2e/signup.spec.ts), which GoTrue rolls back when it
      # cannot send the code.
      - name: Start local stack
        run: supabase start -x studio,imgproxy,logflare,vector,supavisor,edge-runtime,postgres-meta

      # Production is built from the migrations alone: no seed. It must still hold the
      # countries, states and catalogue, every country disabled until the four-eyes go-live.
      - name: Production-shaped database (migrations, no seed)
        run: |
          supabase db reset --local --no-seed
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 \
            -f supabase/tools/check_production_reference.sql

      - name: Apply every migration and the seed from zero
        run: supabase db reset --local

      - name: pgTAP
        run: supabase test db --local supabase/tests/database

      # Our schemas only: extension code (PostGIS in `extensions`) is not ours to fix.
      - name: Lint (plpgsql_check)
        run: supabase db lint --local --schema public,private,ledger,kyc,audit --level warning --fail-on warning

      # Proves what revocation means to a signed-in app: pgTAP can only show rows vanish.
      - name: Sessions and storage end to end (real GoTrue and Storage)
        run: |
          set -euo pipefail
          eval "$(supabase status -o env --workdir "$GITHUB_WORKSPACE")"
          export API_URL SECRET_KEY ANON_KEY PUBLISHABLE_KEY
          bash supabase/tests/e2e/sessions_e2e.sh
          bash supabase/tests/e2e/storage_e2e.sh

      # The app's own Supabase repositories against the real stack: sign-in, request to offer
      # to held payment, the job, proofs, ratings, a dispute, wallet, KYC upload and account
      # deletion. It is what found the deferred-trigger permission failure (audit Y.28) that
      # pgTAP cannot see, because a test transaction never commits.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: App repositories end to end (Dart)
        run: |
          set -euo pipefail
          eval "$(supabase status -o env --workdir "$GITHUB_WORKSPACE")"
          export SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_KEY="$SERVICE_ROLE_KEY"
          for dir in packages/suskii_domain packages/suskii_core packages/suskii_data; do
            (cd "$dir" && dart pub get)
          done
          (cd packages/suskii_domain && dart run build_runner build)
          cd packages/suskii_data && dart test --tags integration

      # The admin console against the same stack (audit Z.8): staff sign in with a password and
      # a TOTP code they enrol on first use, and each flow checks the database afterwards.
      # kyc-document-url is served by Deno from the playwright config, not by edge-runtime.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm

      - name: Admin console end to end (Playwright)
        run: |
          set -euo pipefail
          eval "$(supabase status -o env --workdir "$GITHUB_WORKSPACE")"
          npm ci
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" \
            NEXT_PUBLIC_SUPABASE_FUNCTIONS_URL=http://127.0.0.1:54390 \
            npm run build -w apps/web-admin
          npx playwright install --with-deps chromium
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" \
            SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
            npx playwright test -c tests/web-admin-e2e

      - name: Upload admin console traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: admin-e2e-results
          path: tests/web-admin-e2e/test-results/
          if-no-files-found: ignore

      # The website on the same stack: a customer publishes, pays, chats and rates; a provider
      # onboards, goes online, offers and runs the job. Screens must follow the server without
      # a reload, through broadcasts or the refresh timer, since no table changes are published.
      - name: Website end to end (Playwright)
        run: |
          set -euo pipefail
          eval "$(supabase status -o env --workdir "$GITHUB_WORKSPACE")"
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" \
            npm run build -w apps/web-customer
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" \
            SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
            npx playwright test -c tests/web-customer-e2e

      - name: Upload website traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-customer-e2e-results
          path: tests/web-customer-e2e/test-results/
          if-no-files-found: ignore

      - name: Security and performance advisors
        run: supabase db advisors --local --type all --level warn --fail-on warn

      # Contract drift check lands with contracts v1 (Stage B); until then the generated types
      # are published as an artifact so both agents can inspect them.
      - name: Generate TypeScript types
        run: supabase gen types --local --lang typescript --schema public > database.types.ts

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: database-types
          path: database.types.ts

      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup
