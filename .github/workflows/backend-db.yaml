name: backend-db

# Database CI (docs/plan/infra-cicd.md §5). Path-filtered so it never runs for frontend-only
# changes and never overlaps frontend-ci.yaml, which belongs to Kimi Code.
# On main it runs as the first stage of pipeline-main.yaml, which deploys only if it passes.
on:
  pull_request:
    paths: ['supabase/**', '.github/workflows/backend-db.yaml']
  workflow_call:

permissions:
  contents: read

concurrency:
  group: backend-db-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # CI-only placeholder so config.toml's send_sms hook validates; not a real secret.
      SEND_SMS_HOOK_SECRETS: v1,whsec_Y2ktb25seS1wbGFjZWhvbGRlci1ub3QtYS1zZWNyZXQ=
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0

      - name: Deploy config writer tests
        run: bash supabase/deploy/write-remote-config_test.sh

      # Auth (gotrue) and storage stay up so the hook wiring in config.toml and the bucket
      # policies are exercised against the real services; the rest is skipped.
      - name: Start local stack
        run: supabase start -x studio,imgproxy,mailpit,logflare,vector,supavisor,edge-runtime,realtime,postgres-meta

      - name: Apply every migration and the seed from zero
        run: supabase db reset --local

      - name: pgTAP
        run: supabase test db --local supabase/tests/database

      # Our schemas only: extension code (PostGIS in `extensions`) is not ours to fix.
      - name: Lint (plpgsql_check)
        run: supabase db lint --local --schema public,private,ledger,kyc,audit --level warning --fail-on warning

      # Proves what revocation means to a signed-in app: pgTAP can only show rows vanish.
      - name: Sessions and storage end to end (real GoTrue and Storage)
        run: |
          set -euo pipefail
          eval "$(supabase status -o env --workdir "$GITHUB_WORKSPACE")"
          export API_URL SECRET_KEY ANON_KEY PUBLISHABLE_KEY
          bash supabase/tests/e2e/sessions_e2e.sh
          bash supabase/tests/e2e/storage_e2e.sh

      - name: Security and performance advisors
        run: supabase db advisors --local --type all --level warn --fail-on warn

      # Contract drift check lands with contracts v1 (Stage B); until then the generated types
      # are published as an artifact so both agents can inspect them.
      - name: Generate TypeScript types
        run: supabase gen types --local --lang typescript --schema public > database.types.ts

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: database-types
          path: database.types.ts

      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup
