[project]
name = "suskii-workers"
version = "0.1.0"
description = "Long-running and scheduled backend jobs for Suskii (backups first)."
requires-python = ">=3.13"
dependencies = [
  "psycopg[binary]==3.3.5",
  "google-cloud-storage==3.14.1",
]

[project.scripts]
suskii-backup = "suskii_workers.backup.cli:main"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/suskii_workers"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs a PostgreSQL 17 server with the Suskii migrations applied (BACKUP_TEST_SOURCE_URL)",
]
